<div id="pw_root" class="pw-root">
    <div id="pw_backdrop" class="pw-backdrop"></div>

    <section id="pw_window" class="pw-window" role="dialog" aria-modal="true" aria-label="预设工作台">
        <header id="pw_drag_handle" class="pw-header">
            <div class="pw-header-title">
                <span class="pw-header-glyph"><i class="fa-solid fa-sliders"></i></span>
                <span class="pw-header-text">预设工作台</span>
                <span id="pw_header_count" class="pw-header-count">0</span>
            </div>
            <div class="pw-header-actions" data-no-drag="1">
                <button type="button" id="pw_btn_update" class="pw-icon-btn pw-update-indicator" title="检查扩展更新">
                    <i class="fa-solid fa-cloud-arrow-down"></i>
                    <span id="pw_update_dot" class="pw-update-dot"></span>
                </button>
                <button type="button" id="pw_btn_refresh" class="pw-icon-btn" title="重新扫描磁盘上的预设目录">
                    <i class="fa-solid fa-rotate"></i>
                </button>
                <button type="button" id="pw_btn_recenter" class="pw-icon-btn" title="恢复窗口的默认位置与大小">
                    <i class="fa-solid fa-window-restore"></i>
                </button>
                <button type="button" id="pw_btn_close" class="pw-icon-btn pw-icon-btn-close" title="关闭（Esc）">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
        </header>

        <div class="pw-content">
            <nav id="pw_tabs" class="pw-tabs" role="tablist"></nav>

            <div class="pw-toolbar">
                <div class="pw-search">
                    <i class="fa-solid fa-magnifying-glass pw-search-icon"></i>
                    <input type="text" id="pw_search" class="pw-search-input" placeholder="搜索预设名…" autocomplete="off" spellcheck="false" />
                    <button type="button" id="pw_search_clear" class="pw-search-clear" title="清空搜索">
                        <i class="fa-solid fa-circle-xmark"></i>
                    </button>
                </div>
                <div class="pw-toolbar-actions">
                    <button type="button" id="pw_btn_import" class="pw-btn pw-btn-ghost">
                        <i class="fa-solid fa-file-import"></i><span>导入</span>
                    </button>
                    <button type="button" id="pw_btn_export_all" class="pw-btn pw-btn-ghost">
                        <i class="fa-solid fa-file-export"></i><span>全部导出</span>
                    </button>
                    <input type="file" id="pw_import_file" class="pw-hidden-file" accept=".json,application/json" multiple="multiple" />
                </div>
            </div>

            <div id="pw_list" class="pw-list"></div>
        </div>

        <section id="pw_update_banner" class="pw-update-banner">
            <div class="pw-update-top">
                <span class="pw-update-badge"><i class="fa-solid fa-circle-up"></i></span>
                <span class="pw-update-text" id="pw_update_text"></span>
                <span class="pw-update-buttons">
                    <button type="button" id="pw_btn_update_apply" class="pw-btn pw-btn-accent">
                        <i class="fa-solid fa-download"></i><span>立即更新</span>
                    </button>
                    <button type="button" id="pw_btn_update_notes" class="pw-btn pw-btn-ghost">
                        <i class="fa-solid fa-file-lines"></i><span>更新内容</span>
                    </button>
                    <button type="button" id="pw_btn_update_dismiss" class="pw-icon-btn" title="不再提示这个版本">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </span>
            </div>
            <div class="pw-update-notes" id="pw_update_notes"></div>
        </section>

        <footer class="pw-footer">
            <div id="pw_status" class="pw-status">正在读取…</div>
        </footer>

        <div id="pw_resize_handle" class="pw-resize-handle" title="拖动调整窗口大小"></div>
    </section>
</div>
